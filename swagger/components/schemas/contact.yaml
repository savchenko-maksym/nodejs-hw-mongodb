# swagger/components/schemas/contact.yaml

type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - userId
properties:
  _id:
    description: "Contact's ID"
    type: string
    example: 65e4decdd286b30065d54af9

  name:
    description: "Contact's name"
    type: string
    example: John Doe

  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: '+1234567890'

  email:
    description: "Contact's email address"
    type: string
    example: john.doe@example.com

  isFavourite:
    description: 'Whether the contact is marked as favourite'
    type: boolean
    example: true

  contactType:
    description: 'Type of contact'
    type: string
    enum: [work, home, personal]
    example: personal

  userId:
    description: 'ID of the user who owns the contact'
    type: string
    example: 65e4decdd286b30065d54af9

  photo:
    description: "Link to contact's photo"
    type: string
    example: https://res.cloudinary.com/demo/image/upload/v1710672331/avatar.png
